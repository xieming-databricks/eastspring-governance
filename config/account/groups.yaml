schema_version: "1.0"
# Account-level group inventory — the account groups every deployment (env) may use.
#
# Groups are ACCOUNT assets (one group serves every workspace / env in the account), so they are
# declared once here, not per env. Each env's config/reference/<env>.yaml lists only the group
# NAMES it may grant to; the validator warns if an env uses a name that is not in this inventory.
#
# name        the group's display name (what grants reference).
# external_id the group's Microsoft Entra ID Object ID (GUID) — the authoritative AIM link — and
#             it picks how the group is provisioned:
#               set   -> resolved (and provisioned) from Entra ID via AIM (`iam-v2 resolve-group`)
#               null  -> created as a local Databricks account group (no Entra link)
groups:
  - { name: hera-all-esg-read-unmasked,    external_id: null }
  - { name: hera-all-esg-read-masked,      external_id: null }
  - { name: hera-sg-esg-read-masked,       external_id: null }
  - { name: hera-sg-eq-read-masked,        external_id: null }
  - { name: hera-sg-fi-read-masked,        external_id: null }
  - { name: hera-all-admin-admin-unmasked, external_id: null }
