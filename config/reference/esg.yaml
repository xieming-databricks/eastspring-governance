schema_version: "1.0"
# Reference allow-list (authoritative approved vocabulary) for this deployment (hera-dev / ESG).
#
# This is the single source of truth for the groups, schemas, data products, and governed tags
# that the Access Matrix is allowed to use. Anything referenced by the workbook / generated config that is NOT
# listed here should raise a validation WARNING (a soft, fail-open check — distinct from the hard,
# fail-closed JSON-Schema validation). It is hand-curated by governance, not generated from the
# workbook (the workbook is validated *against* it).

# ---- target catalog: the single catalog this deployment is authoritative over ---
# Full-sync makes this catalog framework-owned: any grant in it the config does not
# declare becomes a REMOVE (minus the protected set below). The reconcile notebook
# takes the catalog from here only (there is no widget override).
target_catalog: hera-dev

# ---- protected set: full-sync guardrails (never REMOVE / never touch) ------------
# deployers        account identities/groups that run the reconcile (protected even when
#                  a human runs it interactively and current_user() would miss them).
# admin_groups     account/metastore admin groups whose grants full-sync must never revoke.
# protected_schemas extra schema names full-sync must never touch (on top of the built-in
#                  information_schema).

protected_principals:
  deployers: []
  admin_groups: [account admins]

protected_schemas: []

# ---- skip_base_grants: don't manage base-table grants (base_grants.yaml) -----------------
# false (default): base_grants.yaml + rbac_view_grants.yaml are both applied, and grant full-sync
#                  covers the whole target_catalog (undeclared grants are REVOKEd).
# true           : only the serving-schema (view) grants are managed. base_grants.yaml is NOT
#                  applied, and grant full-sync is limited to serving_schemas — grants anywhere
#                  else (base tables in source_schemas, governance) are left exactly as they are.
#                  Catalog-level grants (USE CATALOG for the view groups) are still added, never
#                  revoked. Tags and column-mask policies on the base tables are unaffected.
# Must be a real boolean (true / false); anything else is treated as false and warned about.
skip_base_grants: false

# ---- masking: principals exempt from column masking (ETL / pipeline run-as) ------
# Added to the EXCEPT clause of every column-mask policy so these read UNMASKED data (a masked
# read materialized by a pipeline would persist masked values downstream). Use dedicated ETL
# groups where possible (<=20 principals across TO + EXCEPT). Example: hera-etl-ingest.
mask_exempt_principals: []

# ---- RLS: dynamic-view entitlement allow-list -----------------------------------
# The group -> rls_column allow-list the dynamic views semi-join against:
#   WHERE <rls_column> IN (SELECT <rls_column> FROM <rls_entitlement_table>
#                          WHERE is_account_group_member(<rls_group_column>))
# Framework-derived by the packaged sql/group_portfolio_access.sql (rendered for target_catalog +
# governance_schemas) from the customer-owned entitlements tables.
rls_entitlement_table: hera-dev.governance.group_portfolio_access
rls_group_column: ad_group

# ---- groups: the account groups THIS deployment's matrix may grant to, and how to provision them --
# Provisioned per workspace (`ucgov-provision groups --reference <this file>`, through the
# workspace-level IAM v2 proxy API — no account-level access needed). The groups themselves are
# still account-level (usable in UC grants); an env that shares a group with another env lists it too.
#
# name        the group's display name (what grants reference). A name ending in "unmasked" is a
#             read-UNMASKED group: it is generated into every acm_mask_* UDF's unmasked check, so
#             its members see raw PII. Name groups deliberately.
# external_id the group's Microsoft Entra ID Object ID (GUID) — the authoritative AIM link — and
#             it picks how the group is provisioned:
#               set   -> resolved (and provisioned) from Entra ID via AIM (`resolve-group-proxy`)
#               null  -> created as a local Databricks account group (no Entra link)
groups:
  - { name: GSGEIS-hera-all-esg-read-unmasked, external_id: c7855984-0e29-4463-af86-d2103d1299d1 }
  - { name: GSGEIS-hera-all-esg-read-masked,   external_id: 1f3f024b-61dc-4625-9921-cf3e164f681f }
  - { name: GSGEIS-hera-sg-esg-read-masked,    external_id: c2ae0a3d-ae85-431d-ad59-d1b3e245ad10 }
  - { name: GSGEIS-hera-sg-eq-read-masked,     external_id: 27888b59-c6a9-4cdb-a67f-7391ff654a67 }
  - { name: GSGEIS-hera-sg-fi-read-masked,     external_id: 7af49fb7-690c-4861-be9e-fbd0579d9006 }
  - { name: GSGEIS-hera-all-admin-admin-unmasked,     external_id: null }

# ---- schemas by role (all created by Terraform; the union is the approved-schema set) ----------
# governance_schemas: helper schema(s) — mask UDFs, the group_portfolio_access MV, entitlement tables.
# source_schemas    : base tables live here — locked down; dynamic views READ from them.
# serving_schemas   : dynamic views live here (end-users granted READ). A view's target_schema must
#                     be one of these (validated as a fail-open warning).
governance_schemas:
  - hera-dev.governance
source_schemas:
  - hera-dev.gold
  - hera-dev.silver
serving_schemas:
  - hera-dev.dm_esg
  - hera-dev.dm_something

# ---- data products: approved data_product asset labels (grant selection) -----
# The data_product values the matrix may attach as labels / match grant rules on. Off-list
# values raise a fail-open warning.
data_products:
  - investment_esg
  - investment_research
  - market_data
  - mdm_portfolio_structure
  - mdm_security
  - portfolio_position
  - portfolio_transaction

# ---- governed tags: approved acm_-namespaced tag key -> approved values ------
# The keys are the approved tag-key set; each list is the approved values for that key.
governed_tags:
  acm_pii_type: [FULL_NAME, EMAIL, PASSPORT, identifier, secret]
