schema_version: "1.0"
column_mask_policies:
  # All three acm_pii_type routes for investments, scoped to the gold schema and
  # narrowed by the investments table tag.
  - scope: asset_dev.gold
    table_matching_tags: {acm_business_function: investments}
    column_matching_tags: {acm_pii_type: FULL_NAME}
    function: asset_dev.governance.acm_mask_full_name_investments
  - scope: asset_dev.gold
    table_matching_tags: {acm_business_function: investments}
    column_matching_tags: {acm_pii_type: identifier}
    function: asset_dev.governance.acm_mask_identifier_investments
  - scope: asset_dev.gold
    table_matching_tags: {acm_business_function: investments}
    column_matching_tags: {acm_pii_type: secret}
    function: asset_dev.governance.acm_mask_secret_investments

  # Catalog-wide mask with NO table_matching_tags (applies to every FULL_NAME
  # column under the catalog scope). Exercises the optional table filter.
  - scope: asset_dev
    column_matching_tags: {acm_pii_type: FULL_NAME}
    function: asset_dev.governance.acm_mask_full_name_global

  # Table-scoped mask for compliance identifiers (ON TABLE grain scope).
  - scope: asset_dev.gold.compliance_dashboard
    table_matching_tags: {acm_business_function: compliance}
    column_matching_tags: {acm_pii_type: identifier}
    function: asset_dev.governance.acm_mask_identifier_compliance

row_filter_policies:
  # Two-dimension filter (region AND legal_entity) at schema scope.
  - scope: asset_dev.gold
    table_matching_tags: {acm_business_function: investments}
    column_matching_tags:
      - {condition: {acm_rls: region}, as: region}
      - {condition: {acm_rls: legal_entity}, as: legal_entity}
    function: asset_dev.governance.acm_filter_region_legal_entity

  # Single-dimension filter at a different schema scope (no table filter).
  - scope: asset_dev.silver
    column_matching_tags:
      - {condition: {acm_rls: region}, as: region}
    function: asset_dev.governance.acm_filter_region

  # Maximum THREE MATCH COLUMNS conditions with unique aliases — the platform
  # quota boundary. Aliases must be distinct even when a dimension repeats.
  - scope: asset_dev.gold.positions
    table_matching_tags: {acm_business_function: performance_attribution}
    column_matching_tags:
      - {condition: {acm_rls: region},       as: region}
      - {condition: {acm_rls: legal_entity}, as: legal_entity}
      - {condition: {acm_rls: region},       as: region_secondary}
    function: asset_dev.governance.acm_filter_region_legal_entity_region2
