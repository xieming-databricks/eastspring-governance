schema_version: "1.0"
# Asset labels select securables for grant rules (grants.yaml match.labels).
# Config-only — these are NEVER written to Unity Catalog. Column PII/RLS tags that
# DO get materialized live in tags.yaml.
labels:
  # catalog
  - securable: {type: catalog, name: asset_dev}
    labels: {business_function: investments}
  # schema
  - securable: {type: schema, name: asset_dev.gold}
    labels: {business_function: investments}
  - securable: {type: schema, name: asset_dev.silver}
    labels: {business_function: performance_attribution}
  # table
  - securable: {type: table, name: asset_dev.gold.investment_accounts}
    labels: {business_function: investments}
  - securable: {type: table, name: asset_dev.gold.restricted_positions}
    labels: {business_function: investments}
  - securable: {type: table, name: asset_dev.gold.trades}
    labels: {business_function: investments}
  - securable: {type: table, name: asset_dev.gold.nav_history}
    labels: {business_function: quants}
  - securable: {type: table, name: asset_dev.gold.benchmark}
    labels: {business_function: quants}
  - securable: {type: table, name: asset_dev.gold.positions}
    labels: {business_function: performance_attribution}
  - securable: {type: table, name: asset_dev.gold.client_master}
    labels: {business_function: compliance}
  # view
  - securable: {type: view, name: asset_dev.gold.shared_reference}
    labels: {business_function: investments}
  - securable: {type: view, name: asset_dev.gold.investment_summary}
    labels: {business_function: quants}
  - securable: {type: view, name: asset_dev.gold.compliance_dashboard}
    labels: {business_function: compliance}
  # function
  - securable: {type: function, name: asset_dev.gold.valuation_label}
    labels: {business_function: investments}
  # volume
  - securable: {type: volume, name: asset_dev.gold.exports}
    labels: {business_function: investments}
  - securable: {type: volume, name: asset_dev.gold.raw_drop}
    labels: {business_function: investments}
