schema_version: "1.0"
grant_rules:
  # 1. READ for investments — masked + unmasked groups share identical UC reach.
  #    match tables+views, add a function and a volume, carve out restricted tables.
  - groups:
      - hera-adbk-investments-read
      - hera-adbk-investments-read-unmasked
    bundle: READ
    match:
      object_types: [table, view]
      tags: {acm_business_function: investments}
    include:
      - {type: function, name: asset_dev.gold.valuation_label}
      - {type: volume, name: asset_dev.gold.exports}
    exclude:
      - {type: table, name: asset_dev.gold.restricted_positions}
      - {type: table, name: asset_dev.gold.client_master}

  # 2. WRITE for investments at schema grain.
  - groups: [hera-adbk-investments-write]
    bundle: WRITE
    match:
      object_types: [schema]
      tags: {acm_business_function: investments}

  # 3. OWNER (deployment/owner create rights) at schema grain.
  - groups: [hera-adbk-investments-owner]
    bundle: OWNER
    match:
      object_types: [schema]
      tags: {acm_business_function: investments}

  # 4. ADMIN (MANAGE) at catalog grain.
  - groups: [hera-adbk-investments-admin]
    bundle: ADMIN
    match:
      object_types: [catalog]
      tags: {acm_business_function: investments}

  # 5. READ for performance_attribution — masked + unmasked.
  - groups:
      - hera-adbk-performance-attribution-read
      - hera-adbk-performance-attribution-read-unmasked
    bundle: READ
    match:
      object_types: [table, view]
      tags: {acm_business_function: performance_attribution}

  # 6. WRITE for performance_attribution at table grain.
  - groups: [hera-adbk-performance-attribution-write]
    bundle: WRITE
    match:
      object_types: [table]
      tags: {acm_business_function: performance_attribution}

  # 7. READ for compliance — match tables+views, add a specific view, exclude a table.
  - groups: [hera-adbk-compliance-read]
    bundle: READ
    match:
      object_types: [table, view]
      tags: {acm_business_function: compliance}
    include:
      - {type: view, name: asset_dev.gold.compliance_dashboard}
    exclude:
      - {type: table, name: asset_dev.gold.restricted_positions}

  # 8. ADMIN for compliance at schema grain.
  - groups: [hera-adbk-compliance-admin]
    bundle: ADMIN
    match:
      object_types: [schema]
      tags: {acm_business_function: compliance}

  # 9. quants READ — include-only rule (no `match`): an explicit, hand-picked set
  #    spanning several object types.
  - groups: [hera-adbk-quants-read]
    bundle: READ
    include:
      - {type: table,    name: asset_dev.gold.nav_history}
      - {type: table,    name: asset_dev.gold.benchmark}
      - {type: view,     name: asset_dev.gold.investment_summary}
      - {type: function, name: asset_dev.gold.valuation_label}
      - {type: volume,   name: asset_dev.gold.exports}

  # 10. quants WRITE at table grain.
  - groups: [hera-adbk-quants-write]
    bundle: WRITE
    match:
      object_types: [table]
      tags: {acm_business_function: quants}

  # 11. Kitchen-sink match spanning ALL four BF-legal grains at once.
  - groups: [hera-adbk-investments-read]
    bundle: READ
    match:
      object_types: [catalog, schema, table, view]
      tags: {acm_business_function: investments}

  # 12. Platform include-only rule spanning ALL SIX object types.
  - groups: [hera-adbk-platform-read]
    bundle: READ
    include:
      - {type: catalog,  name: asset_dev}
      - {type: schema,   name: asset_dev.gold}
      - {type: table,    name: asset_dev.gold.investment_accounts}
      - {type: view,     name: asset_dev.gold.shared_reference}
      - {type: function, name: asset_dev.gold.valuation_label}
      - {type: volume,   name: asset_dev.gold.raw_drop}
