schema_version: "1.0"
# Column-routing tags, materialized to UC for ABAC masking / RLS. Asset selection for
# grant rules lives in labels.yaml (labels — never materialized).
tags:
  # ---- acm_pii_type routes ----------------------------------------------
  - securable: {type: column, name: asset_dev.gold.investment_accounts.client_name}
    tags: {acm_pii_type: FULL_NAME}
  - securable: {type: column, name: asset_dev.gold.investment_accounts.client_id}
    tags: {acm_pii_type: identifier}
  - securable: {type: column, name: asset_dev.gold.investment_accounts.ssn}
    tags: {acm_pii_type: secret}
  - securable: {type: column, name: asset_dev.gold.trades.trader_name}
    tags: {acm_pii_type: FULL_NAME}

  # ---- acm_rls dimensions -----------------------------------------------
  - securable: {type: column, name: asset_dev.gold.investment_accounts.region}
    tags: {acm_rls: region}
  - securable: {type: column, name: asset_dev.gold.investment_accounts.legal_entity}
    tags: {acm_rls: legal_entity}
  - securable: {type: column, name: asset_dev.gold.positions.region}
    tags: {acm_rls: region}
  - securable: {type: column, name: asset_dev.gold.positions.legal_entity}
    tags: {acm_rls: legal_entity}

  # ---- a column carrying BOTH a mask route and an RLS route -------------
  - securable: {type: column, name: asset_dev.gold.client_master.tax_id}
    tags: {acm_pii_type: secret, acm_rls: region}
