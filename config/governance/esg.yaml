schema_version: "1.0"
# Governance operational config for this deployment (hera-dev / ESG). Hand-curated, per-deployment;
# sibling of config/reference/esg.yaml. Loaded raw by the reconcile notebook (no JSON schema).

# ---- principals exempt from column masking (ETL / pipeline run-as identities) ----
# Added to the EXCEPT clause of every column-mask policy so these principals read UNMASKED data.
# This is critical for ETL: a masked read materialized by a pipeline would persist masked values
# downstream. Use dedicated ETL groups where possible (a policy allows <=20 principals across
# TO + EXCEPT). Example: hera-etl-ingest, sp-eastspring-pipelines.
mask_exempt_principals: []

# ---- RLS: dynamic-view entitlement allow-list -----------------------------------
# The group -> rls_column allow-list the dynamic views semi-join against:
#   WHERE <rls_column> IN (SELECT <rls_column> FROM <rls_entitlement_table>
#                          WHERE is_account_group_member(<rls_group_column>))
# Framework-derived by sql/group_portfolio_access.sql from the customer-owned entitlements tables.
# The table must expose a column named the same as each view's rls_column (e.g. portfolio_code)
# plus the group column below.
rls_entitlement_table: hera-dev.governance.group_portfolio_access
rls_group_column: ad_group
