$schema: https://json-schema.org/draft/2020-12/schema
$id: https://eastspring.governance/schemas/config/v1/grants.schema.yaml
title: GrantsYaml (v1.0)
type: object
additionalProperties: false
required:
- schema_version
- grant_rules
properties:
  schema_version:
    $ref: common.schema.yaml#/$defs/SchemaVersion
  grant_rules:
    type: array
    items:
      $ref: '#/$defs/GrantRule'
$defs:
  GrantMatch:
    $comment: 'object_types must be a non-empty unique list; labels is a non-empty asset-label map (config-only, never materialized to UC). Grain legality: business_function permits only container/table/view grains, enforced via if/then.'
    type: object
    additionalProperties: false
    required:
    - object_types
    - labels
    properties:
      object_types:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: common.schema.yaml#/$defs/ObjectType
      labels:
        $ref: common.schema.yaml#/$defs/LabelMap
    if:
      properties:
        labels:
          required:
          - business_function
    then:
      properties:
        object_types:
          items:
            enum:
            - catalog
            - schema
            - table
            - view
  GrantRule:
    $comment: match is present OR include contains at least one object (enforced via anyOf on required).
    type: object
    additionalProperties: false
    required:
    - groups
    - bundle
    properties:
      rule_id:
        $comment: Optional source Access-Matrix Grant Rule id (e.g. GR001), for traceability.
        $ref: common.schema.yaml#/$defs/NonEmptyString
      groups:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: common.schema.yaml#/$defs/NonEmptyString
      bundle:
        $ref: common.schema.yaml#/$defs/Bundle
      match:
        $ref: '#/$defs/GrantMatch'
      include:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/ExceptionRef'
      exclude:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/ExceptionRef'
    anyOf:
    - required:
      - match
    - required:
      - include
      properties:
        include:
          minItems: 1
  ExceptionRef:
    $comment: An include/exclude object ref, optionally tagged with its source Access-Matrix exception id (exp_id). Like ObjectRef; name shape validated per declared type via oneOf.
    type: object
    unevaluatedProperties: false
    required:
    - type
    - name
    properties:
      type:
        $ref: common.schema.yaml#/$defs/ObjectType
      name:
        type: string
      exp_id:
        $ref: common.schema.yaml#/$defs/NonEmptyString
    oneOf:
    - properties:
        type:
          const: catalog
        name:
          $ref: common.schema.yaml#/$defs/CatalogName
    - properties:
        type:
          const: schema
        name:
          $ref: common.schema.yaml#/$defs/SchemaName
    - properties:
        type:
          enum:
          - table
          - view
          - function
          - volume
        name:
          $ref: common.schema.yaml#/$defs/ObjectName
