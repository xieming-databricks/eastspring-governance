$schema: https://json-schema.org/draft/2020-12/schema
$id: https://eastspring.governance/schemas/config/v1/policies.schema.yaml
title: PoliciesYaml (v1.0)
type: object
additionalProperties: false
required:
- schema_version
properties:
  schema_version:
    $ref: common.schema.yaml#/$defs/SchemaVersion
  column_mask_policies:
    type: array
    items:
      $ref: '#/$defs/ColumnMaskPolicy'
  row_filter_policies:
    type: array
    items:
      $ref: '#/$defs/RowFilterPolicy'
$defs:
  ColumnMaskPolicy:
    type: object
    additionalProperties: false
    required:
    - scope
    - column_matching_tags
    - function
    properties:
      scope:
        $ref: common.schema.yaml#/$defs/PolicyScope
      table_matching_tags:
        $ref: common.schema.yaml#/$defs/AssetTagMap
      column_matching_tags:
        $comment: Exactly the acm_pii_type routing key.
        type: object
        additionalProperties: false
        required:
        - acm_pii_type
        properties:
          acm_pii_type:
            $ref: common.schema.yaml#/$defs/AcmPiiType
      function:
        $ref: common.schema.yaml#/$defs/FrameworkManagedFunctionName
  RlsColumnMatch:
    type: object
    additionalProperties: false
    required:
    - condition
    - as
    properties:
      condition:
        type: object
        additionalProperties: false
        required:
        - acm_rls
        properties:
          acm_rls:
            $ref: common.schema.yaml#/$defs/AcmRlsDimension
      as:
        $ref: common.schema.yaml#/$defs/Identifier
  RowFilterPolicy:
    $comment: 1..3 MATCH COLUMNS conditions (platform quota). Alias uniqueness within a policy is enforced in the semantic layer.
    type: object
    additionalProperties: false
    required:
    - scope
    - column_matching_tags
    - function
    properties:
      scope:
        $ref: common.schema.yaml#/$defs/PolicyScope
      table_matching_tags:
        $ref: common.schema.yaml#/$defs/AssetTagMap
      column_matching_tags:
        type: array
        minItems: 1
        maxItems: 3
        items:
          $ref: '#/$defs/RlsColumnMatch'
      function:
        $ref: common.schema.yaml#/$defs/FrameworkManagedFunctionName
