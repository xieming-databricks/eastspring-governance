$schema: https://json-schema.org/draft/2020-12/schema
$id: https://eastspring.governance/schemas/config/v1/tags.schema.yaml
title: TagsYaml (v1.0)
type: object
additionalProperties: false
required:
- schema_version
- tags
properties:
  schema_version:
    $ref: common.schema.yaml#/$defs/SchemaVersion
  tags:
    type: array
    items:
      $ref: '#/$defs/TagAssignment'
$defs:
  TagAssignment:
    $comment: Column-routing tags only (acm_pii_type) on COLUMN securables. Asset selection for grants lives in labels.yaml (labels, never materialized). 'a securable appears at most once in tags.yaml' is a cross-item rule enforced in the semantic layer.
    type: object
    additionalProperties: false
    required:
    - securable
    - tags
    properties:
      securable:
        $comment: Column securables only; asset securables carry labels (labels.yaml), not tags.
        type: object
        additionalProperties: false
        required:
        - type
        - name
        properties:
          type:
            const: column
          name:
            $ref: common.schema.yaml#/$defs/ColumnName
      tags:
        type: object
        minProperties: 1
        additionalProperties: false
        properties:
          acm_pii_type:
            $comment: Free non-empty string; the approved value vocabulary is validated (fail-open) against the reference allow-list's governed_tags, not by a closed enum here.
            $ref: common.schema.yaml#/$defs/NonEmptyString
